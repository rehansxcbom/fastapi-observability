name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Security: Explicitly set minimum permissions for the GITHUB_TOKEN
permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Enforce Code Style with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Security Scan (Bandit)
        run: bandit -r . -c "pyproject.toml" || bandit -r . -ll

      - name: Run pytest
        run: pytest
        env: 
          DB_PASSWORD: test_dummy_password
